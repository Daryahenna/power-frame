faq:
  - question: "Сколько стоит ремонт рамы Rexton?"
    answer: >
      Точная стоимость зависит от степени поражения коррозией и объёма работ — называем её
      после диагностики по фото или очной. Ориентировочно от [ЦЕНА] за локальный ремонт до
      [ЦЕНА] за комплексный ремонт со снятием кузова.
  - question: "Можно ли отремонтировать раму без снятия кузова?"
    answer: >
      Да, если поражение коррозией точечное и не затрагивает силовые зоны критически — делаем
      локальный ремонт без снятия кузова. При обширном поражении или деформации рамы требуется
      демонтаж кузова для полного доступа.
  - question: "Через сколько лет начинает гнить рама Rexton?"
    answer: >
      По наблюдениям владельцев на форумах (Drive2, Drom), первые очаги коррозии могут
      появляться уже после первой-второй зимы эксплуатации в реагентной среде, к 5–7 годам
      это уже заметная проблема у части автомобилей. Точный срок сильно зависит от условий
      хранения и обработки антикором.
  - question: "Ремонт или замена рамы — что выгоднее?"
    answer: >
      В большинстве случаев ремонт (сварка, вставки, антикор) дешевле и быстрее замены рамы
      в сборе. Замена целесообразна только при критической деформации или полном разрушении
      силовых элементов — решаем это после диагностики.
  - question: "Сохранится ли номер рамы после ремонта?"
    answer: >
      Да, при ремонте номер рамы сохраняется — мы не затрагиваем зону маркировки VIN. Это
      важно для юридической чистоты автомобиля и последующих регистрационных действий.

