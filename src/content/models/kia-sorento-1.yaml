faq:
  - question: "Какой Sorento рамный, а какой нет?"
    answer: >
      Рамным является только Sorento первого поколения (BL, 2002–2009). Все поколения с 2009
      года построены на несущем кузове, отдельной рамы у них нет. Если не уверены, какой у вас
      год выпуска — пришлите VIN или фото, подскажем точно.
  - question: "Сколько стоит ремонт рамы Sorento I?"
    answer: >
      Зависит от объёма повреждений — точную стоимость называем после диагностики.
      Ориентировочно от [ЦЕНА].
  - question: "Можно ли отремонтировать раму без снятия кузова?"
    answer: >
      При точечной коррозии — да. При серьёзном поражении или деформации может потребоваться
      более глубокий доступ.
  - question: "Ремонт или замена рамы — что выгоднее?"
    answer: >
      Контрактную раму на Sorento I найти в хорошем состоянии сложно — в большинстве случаев
      ремонт рациональнее замены.
  - question: "Сохранится ли номер рамы после ремонта?"
    answer: >
      Да, зона маркировки VIN при ремонте не затрагивается.

