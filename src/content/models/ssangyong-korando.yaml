painText: >
  Важно: под именем Korando выпускались два принципиально разных автомобиля. Старый Korando
  Family — классический рамный внедорожник на платформе, родственной Musso, выпускался
  примерно до середины 2000-х. Новый Korando (с 2010 года) — это уже кроссовер на несущем
  кузове без отдельной рамы, и ремонт рамы к нему неприменим в принципе. На этой странице
  речь только о старом рамном Korando Family. Типовая проблема — коррозия в зоне контакта
  кузова с рамой и в районе порогов, характерная для body-on-frame конструкции этого возраста.
