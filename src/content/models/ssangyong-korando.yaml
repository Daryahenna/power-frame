faq:
  - question: "Чем старый рамный Korando Family отличается от нового Korando?"
    answer: >
      Старый Korando Family (примерно до середины 2000-х) — рамный внедорожник, к которому
      применим ремонт рамы. Новый Korando (с 2010 года) построен на несущем кузове без
      отдельной рамы — эта услуга к нему не относится. Если сомневаетесь, к какому поколению
      относится ваш автомобиль, пришлите VIN или фото — подскажем.
  - question: "Сколько стоит ремонт рамы Korando Family?"
    answer: >
      Точная стоимость зависит от объёма поражения коррозией — называем после диагностики.
      Ориентировочно от [ЦЕНА].
  - question: "Можно ли отремонтировать раму без снятия кузова?"
    answer: >
      В большинстве случаев с точечной коррозией — да, локальный ремонт возможен без снятия
      кузова. При серьёзной деформации или обширном поражении может понадобиться демонтаж.
  - question: "Ремонт или замена рамы — что выгоднее?"
    answer: >
      Для Korando Family найти контрактную раму на замену часто сложнее и дороже, чем
      качественный ремонт — в большинстве случаев ремонт рациональнее.
  - question: "Сохранится ли номер рамы после ремонта?"
    answer: >
      Да, ремонт не затрагивает зону маркировки VIN, номер рамы сохраняется.

