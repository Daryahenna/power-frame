faq:
  - question: "Mohave и Borrego — это одна и та же модель?"
    answer: >
      Да, это одна модель под разными именами для разных рынков. В России и Корее — Mohave,
      на части экспортных рынков продавалась как Borrego. Конструкция рамы идентична.
  - question: "Сколько стоит ремонт рамы Mohave?"
    answer: >
      Зависит от объёма повреждений — точную стоимость называем после диагностики.
      Ориентировочно от [ЦЕНА].
  - question: "Можно ли отремонтировать раму без снятия кузова?"
    answer: >
      При точечной коррозии — да. При серьёзном поражении или деформации может потребоваться
      более глубокий доступ.
  - question: "Почему сложно найти сервис именно по Kia Mohave?"
    answer: >
      Mohave — редкая модель на рынке рамных внедорожников, и большинство сервисов
      специализируются на SsangYong. Мы работаем с любыми body-on-frame конструкциями,
      включая Mohave.
  - question: "Сохранится ли номер рамы после ремонта?"
    answer: >
      Да, зона маркировки VIN при ремонте не затрагивается.

