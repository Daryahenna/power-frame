faq:
  - question: "Работаете с коммерческим транспортом, не только с легковыми внедорожниками?"
    answer: >
      Да, Bongo / K2500 / K3000 — отдельное направление в нашей работе с рамами: тот же
      принцип диагностики и ремонта, но с поправкой на эксплуатационные нагрузки грузовика.
  - question: "Сколько стоит ремонт рамы Bongo?"
    answer: >
      Зависит от объёма повреждений и модификации (K2500/K3000) — точную стоимость называем
      после диагностики. Ориентировочно от [ЦЕНА].
  - question: "Можно ли отремонтировать раму без снятия платформы/кузова?"
    answer: >
      При точечной коррозии — да. При серьёзных повреждениях в силовых зонах может
      понадобиться более глубокий доступ.
  - question: "Как быстро можно отремонтировать раму грузовика — простой критичен?"
    answer: >
      Понимаем, что для коммерческого транспорта простой стоит денег — называем реальные
      сроки сразу после диагностики, без затягивания.
  - question: "Сохранится ли номер рамы после ремонта?"
    answer: >
      Да, зона маркировки VIN при ремонте не затрагивается.

