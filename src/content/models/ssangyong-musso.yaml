faq:
  - question: "Ремонтируете и старый Musso, и новый пикап?"
    answer: >
      Да, работаем и с классическим внедорожником Musso 1990–2000-х, и с современным пикапом
      Musso — конструктивно оба рамные, но у пикапа есть своя специфика по зоне грузовой
      платформы.
  - question: "Сколько стоит ремонт рамы Musso?"
    answer: >
      Зависит от версии кузова и объёма повреждений — точную стоимость называем после
      диагностики. Ориентировочно от [ЦЕНА].
  - question: "Можно ли отремонтировать раму без снятия кузова/платформы?"
    answer: >
      При точечной коррозии — да. При серьёзных повреждениях в зоне крепления платформы
      пикапа может понадобиться более глубокий доступ.
  - question: "Ремонт или замена рамы — что выгоднее?"
    answer: >
      В большинстве случаев ремонт дешевле и быстрее замены рамы в сборе, особенно учитывая
      сложность поиска контрактной рамы под конкретное поколение Musso.
  - question: "Сохранится ли номер рамы после ремонта?"
    answer: >
      Да, зона маркировки VIN при ремонте не затрагивается.

